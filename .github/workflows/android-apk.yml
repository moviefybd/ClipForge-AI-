name: Build ClipForge AI Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept licenses and install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          SDK_LIST="$("$SDKMANAGER" --list)"
          if grep -Fq "platforms;android-36.1" <<< "$SDK_LIST"; then
            "$SDKMANAGER" "platforms;android-36.1"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated ephemeral debug.keystore for debugConfig signing"
          fi

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GitHub secret"
          elif [ ! -f app/google-services.json ]; then
            echo "::notice::app/google-services.json not found. Debug APK will still build (MissingGoogleServicesStrategy.WARN), but Firebase AI Logic features (AI Shorts & AI Subtitles) require google-services.json at runtime."
          else
            echo "Using repository app/google-services.json"
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload ClipForge-AI-APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report build failure
        if: failure()
        run: |
          echo "### ClipForge AI Debug APK build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step logs above for Android SDK, Gradle, Kotlin, or signing errors." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ClipForge AI Debug APK build failed. Inspect the workflow logs above for details."
